name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: "7.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev python3-pil fonts-dejavu-core

      - name: Cache emsdk and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/emsdk
            build/cache
          key: wood-${{ env.EMSDK_VERSION }}-${{ hashFiles('tools/build.sh') }}
          # при изменении build.sh берём прошлый кэш: иначе Freedoom качается заново,
          # а загрузки релизов GitHub иногда отвечают 504
          restore-keys: |
            wood-${{ env.EMSDK_VERSION }}-

      - name: Install emsdk
        run: |
          if [ ! -x ~/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          fi
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          ./tools/build.sh

      - name: Prepare site
        run: |
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
